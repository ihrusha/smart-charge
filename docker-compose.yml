services:
  mongo-bornes:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_BORNES_ROOT_PASSWORD}
      APP_PASSWORD: ${MONGO_BORNES_APP_PASSWORD}
    volumes:
      - mongo-bornes-data:/data/db
      - ./infra/mongo/init-bornes.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  reservations:
    build: ./services/reservations
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      SPRING_MONGODB_URI: mongodb://reservations_app:${MONGO_RESERVATIONS_APP_PASSWORD}@mongo-reservations:27017/smartcharge_reservations
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans le fichier .env}
      BORNES_URL: http://bornes:3001
    depends_on:
      mongo-reservations:
        condition: service_healthy
      bornes:
        condition: service_started

  bornes:
    build: ./services/bornes
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      BORNES_MONGO_URI: "mongodb://bornes_app:${MONGO_BORNES_APP_PASSWORD}@mongo-bornes:27017/smartcharge_bornes?authSource=smartcharge_bornes"
    depends_on:
      mongo-bornes:
        condition: service_healthy

  auth:
    build: ./services/auth
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: "postgres://users_app:${POSTGRES_USERS_PASSWORD}@postgres-users:5432/smartcharge_users"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans le fichier .env}
    depends_on:
      postgres-users:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate -- up && npm start"]

  bff:
    build: ./bff
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth:3003
      RESERVATIONS_SERVICE_URL: http://reservations:3002
      STATIONS_SERVICE_URL: http://bornes:3001
    depends_on:
      auth:
        condition: service_started
      reservations:
        condition: service_started
      bornes:
        condition: service_started

  frontend:
    build: ./frontend/smart-charge-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      bff:
        condition: service_started
    volumes:
      - ./frontend/smart-charge-frontend:/app
      - /app/node_modules

  mongo-reservations:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_RESERVATIONS_ROOT_PASSWORD}
      APP_PASSWORD: ${MONGO_RESERVATIONS_APP_PASSWORD}
    volumes:
      - mongo-reservations-data:/data/db
      - ./infra/mongo/init-reservations.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smartcharge_users
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: ${POSTGRES_USERS_PASSWORD}
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_app -d smartcharge_users"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-bornes-data:
  mongo-reservations-data:
  postgres-users-data: