<header class="barre">
    <a class="logo" routerLink="/">
    <img src="/logo.png" alt="" class="logo-image" />
  </a>

  @if (auth.estConnecte()) {
    <nav>
      <a routerLink="/bornes" routerLinkActive="actif">Bornes</a>
      <a routerLink="/mes-reservations" routerLinkActive="actif">Mes réservations</a>
    </nav>
    <a class="lien-compte" routerLink="/compte" routerLinkActive="actif" title="Mon compte">
      <span class="icone-compte">👤</span>
      <span class="texte-compte">Compte</span>
    </a>
  }
</header>

<main class="container">
  <router-outlet />
</main>
