<section class="carte-auth">
  <h1>Connexion</h1>
  <p>Trouvez une borne et réservez votre créneau de recharge.</p>

  <form (ngSubmit)="seConnecter()">
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" required
           placeholder="vous@exemple.fr" [(ngModel)]="email" />

    <label for="motDePasse">Mot de passe</label>
    <input id="motDePasse" name="motDePasse" type="password" required
           [(ngModel)]="motDePasse" />

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }

    <button type="submit" [disabled]="envoi()">
      {{ envoi() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <p>Pas encore de compte ? <a routerLink="/inscription">Créer un compte</a></p>
</section>
