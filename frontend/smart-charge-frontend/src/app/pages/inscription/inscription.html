<section class="carte-auth">
  <h1>Créer un compte</h1>
  <p>Il suffit de quelques secondes pour réserver votre première recharge.</p>

  <form (ngSubmit)="creerLeCompte()">
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" required
           placeholder="vous@exemple.fr" [(ngModel)]="email" />

    <label for="motDePasse">Mot de passe</label>
    <div class="champ-mot-de-passe">
      <input id="motDePasse" name="motDePasse" required
             placeholder="12 caractères minimum"
             [type]="motDePasseVisible() ? 'text' : 'password'"
             [(ngModel)]="motDePasse" />
      <button type="button" class="bascule" (click)="basculerVisibilite()"
              [attr.aria-label]="motDePasseVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
        {{ motDePasseVisible() ? '🙈' : '👁️' }}
      </button>
    </div>

    <label for="confirmation">Confirmer le mot de passe</label>
    <input id="confirmation" name="confirmation" required
           [type]="motDePasseVisible() ? 'text' : 'password'"
           [(ngModel)]="confirmation" />

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }

    <button type="submit" [disabled]="envoi()">
      {{ envoi() ? 'Création...' : 'Créer mon compte' }}
    </button>
  </form>

  <p>Déjà un compte ? <a routerLink="/connexion">Se connecter</a></p>
</section>
